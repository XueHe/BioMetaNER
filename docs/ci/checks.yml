# Inactive template: GitHub workflow authorization is required before activation.
name: Reproducibility and release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: python scripts/evaluate.py --golden examples/gold.jsonl --predictions examples/predictions.jsonl --allow-unpinned --output outputs/example.json
      - run: python scripts/summarize.py --counts results/figure4/per_seed_per_type.csv --output outputs/summary.csv
